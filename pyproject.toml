[project]
name = "hybrid-data-analyst"
version = "0.1.0"
description = "Agent IA Data Analyst hybride (AWS Bedrock + infra on-premise)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "qdrant-client>=1.11",
    "minio>=7.2",
    "redis>=5.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "langfuse>=2.51",
    "tenacity>=9.0",
    "rich>=13.9",
    "kaggle>=1.6",
    "sqlglot>=25.0",
    "sqlfluff>=3.0",
    "rank-bm25>=0.2",
    "xlsxwriter>=3.2.9",
    "weasyprint>=69.0",
    "python-docx>=1.2.0",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
